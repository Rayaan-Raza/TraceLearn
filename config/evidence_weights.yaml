# FROZEN for holdout evaluation — do not tune after observing evaluation_sequences results.
version: poc-v1

weights:
  static_strong: 0.30
  diagnostic_match: 0.35
  runtime_support: 0.15
  general_test_pattern: 0.10
  previous_same_problem: 0.10
  cross_problem_recurrence: 0.20
  related_success: -0.20
  conflicting_diagnostic: -0.20

history:
  decay_factor: 0.80

thresholds:
  review_confidence: 0.35
  hypothesis_margin: 0.10
  # Confidence of NO_MISCONCEPTION when every test passed and no evidence
  # supports a misconception.
  no_misconception_confidence: 0.80

learner_state:
  min_cross_problem_for_persistent: 2
  min_attempts_for_same_problem_new: 1
  # Recovery and recurrence (docs/LEARNER_STATE_RULES.md). The two
  # confidence values were literals in learner_model/updater.py before;
  # they move here unchanged. The two counts mirror the PERSISTENT rule:
  # recovery, like recurrence, must show on more than one problem.
  # Set before any holdout run; not tuned on data/evaluation_sequences.
  resolved_confidence: 0.25
  recurred_confidence: 0.45
  min_related_successes_for_resolved: 2
  min_distinct_problems_for_resolved: 2
