[pytest]
# The repository has two test suites that must run in separate processes:
#
#   python -m pytest                 dataset / model scripts (tests/)
#   python -m pytest backend/tests   the web backend
#
# backend/tests/conftest.py points the app at a throwaway database and test
# settings when it is imported. Collected together with tests/, the two
# conftests clash (both resolve to the package name "tests"), the backend
# settings are built before that setup, and ~27 backend tests fail against the
# real tracelearn.db. That was the cause of most of the "44 Windows failures".
# CI runs the suites as separate jobs, and a bare `pytest` runs only tests/.
testpaths = tests
